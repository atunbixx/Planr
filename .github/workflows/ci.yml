name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @planr/db run db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @planr/web exec next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54421"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci"
          SUPABASE_SECRET_KEY: "sb_secret_ci"
          NEXT_PUBLIC_BASE_URL: "http://localhost:3000"

  integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @planr/db run db:generate
      - run: pnpm --filter @planr/db run test:int
      - run: pnpm --filter @planr/web run test:int
